---
layout: default
title: Detail Artikel
---

<div class="max-w-4xl mx-auto my-10 px-4">
    <a href="index.html" class="text-red-600 hover:text-red-800 font-semibold inline-flex items-center mb-6">
        <i class="fas fa-arrow-left mr-2"></i> ← Kembali ke Semua Artikel
    </a>

    <div id="loading-detail" class="text-center py-20 text-gray-500">
        <i class="fas fa-spinner fa-spin text-4xl text-red-600 mb-2"></i>
        <p>Sedang memuat isi berita...</p>
    </div>

    <article id="konten-berita" class="hidden bg-white rounded-3xl shadow-xl p-6 md:p-10 overflow-hidden">
        <span id="detail-kategori" class="bg-red-100 text-red-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wide"></span>
        
        <h1 id="detail-judul" class="text-3xl md:text-5xl font-black text-gray-900 mt-4 mb-3 leading-tight"></h1>
        
        <p id="detail-tanggal" class="text-gray-500 text-sm mb-6"></p>
        
        <div id="detail-gambar-container" class="mb-8 hidden">
            <img id="detail-gambar" src="" class="w-full h-auto max-h-[450px] object-cover rounded-2xl shadow-md">
        </div>

        <div id="detail-isi" class="prose prose-red max-w-none text-gray-700 leading-relaxed space-y-4">
            </div>
    </article>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Siomai Magelang
    const firebaseConfig = {
        apiKey: "AIzaSyDv9zylwxNutc2zV-0U2yXHa6ioT0usBVQ",
        authDomain: "siomaimagelang.firebaseapp.com",
        projectId: "siomaimagelang"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function ambilDetailBerita() {
        const loadingEl = document.getElementById('loading-detail');
        const artikelEl = document.getElementById('konten-berita');

        try {
            // 1. Ambil parameter ID dari URL (?id=xxxxxxxxx)
            const urlParams = new URLSearchParams(window.location.search);
            const idBerita = urlParams.get('id');

            if (!idBerita) {
                loadingEl.innerHTML = `<p class="text-red-500 font-bold">ID Berita tidak ditemukan di URL!</p>`;
                return;
            }

            // 2. Tarik data dari Firestore berdasarkan ID tersebut
            const docRef = doc(db, "berita", idBerita);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();

                // 3. Masukkan data Firestore ke elemen HTML
                document.getElementById('detail-judul').textContent = data.title;
                document.getElementById('detail-kategori').textContent = data.category || "Berita";
                
                // Format tanggal agar manusiawi
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    document.getElementById('detail-tanggal').textContent = "Diterbitkan pada: " + date.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
                }

                // Tampilkan gambar cover jika ada
                if (data.imageUrl) {
                    document.getElementById('detail-gambar').src = data.imageUrl;
                    document.getElementById('detail-gambar-container').classList.remove('hidden');
                }

                // Masukkan isi tulisan berita (Mendukung tag HTML dari Quill editor)
                document.getElementById('detail-isi').innerHTML = data.content;

                // 4. Sembunyikan loading dan tampilkan artikelnya
                loadingEl.classList.add('hidden');
                artikelEl.classList.remove('hidden');

            } else {
                loadingEl.innerHTML = `<p class="text-red-500 font-bold">Maaf, berita ini tidak ditemukan atau sudah dihapus.</p>`;
            }

        } catch (error) {
            console.error("Gagal memuat berita:", error);
            loadingEl.innerHTML = `<p class="text-red-500 font-bold">Terjadi kesalahan sistem saat memuat berita.</p>`;
        }
    }

    // Jalankan fungsi saat halaman dibuka
    window.addEventListener('DOMContentLoaded', ambilDetailBerita);
</script>
