        <div id="detail-isi" class="prose prose-red max-w-none text-gray-700 leading-relaxed space-y-4">

        <!-- Share buttons -->

                </a>

        </div>

    <!-- Artikel Terkait -->
    <div class="mt-12">
        <h2 class="text-2xl font-bold mb-6">📰 Artikel Lainnya</h2>
        <div id="artikel-terkait" class="grid md:grid-cols-3 gap-6">
            <div class="col-span-3 text-center py-10 text-gray-500">
                <i class="fas fa-spinner fa-spin text-3xl mb-2 text-red-600"></i>
                <p>Memuat artikel terkait...</p>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDv9zylwxNutc2zV-0U2yXHa6ioT0usBVQ",
        authDomain: "siomaimagelang.firebaseapp.com",
        projectId: "siomaimagelang"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // === FUNGSI PEMBANTU ===
    function cleanSlug(rawSlug) {
        if (!rawSlug) return '';
        // Hapus prefix "baca/" atau "baca.html?slug=" yang mungkin terbawa
        let slug = rawSlug.replace(/^baca\//, '');
        slug = slug.replace(/^baca\.html\?slug=/, '');
        slug = slug.replace(/\.html$/, '');
        slug = slug.replace(/\/$/, '');
        return slug;
    }

    function extractId(str) {
        if (!str) return null;
        const match = str.match(/([a-zA-Z0-9]{20,})$/);
        return match ? match[1] : null;
    }

    function buildBeritaUrl(slug, id) {
        // SELALU gunakan format /baca?slug=... (absolute dari root)
        return `/baca?slug=${slug}-${id}`;
    }

    // === FUNGSI UTAMA ===
    async function ambilDetailBerita() {
        const loadingEl = document.getElementById('loading-detail');
        const artikelEl = document.getElementById('konten-berita');

        try {
            let idBerita = null;
            
            console.log('🔍 MENCARI BERITA...');
            console.log('  URL:', window.location.href);
            
            const urlParams = new URLSearchParams(window.location.search);
            
            // METHOD 1: ?id=xxx
            const queryId = urlParams.get('id');
            if (queryId && queryId.length >= 20) {
                idBerita = queryId;
                console.log('✅ ID dari ?id=', idBerita);
            }
            
            // METHOD 2: ?slug=xxx (bersihkan dulu)
            if (!idBerita) {
                let slugParam = urlParams.get('slug');
                if (slugParam) {
                    slugParam = cleanSlug(slugParam);
                    console.log('🔍 Slug dibersihkan:', slugParam);
                    
                    // Coba ekstrak ID dari slug
                    const slugId = extractId(slugParam);
                    if (slugId) {
                        idBerita = slugId;
                        console.log('✅ ID dari slug:', idBerita);
                    } else {
                        // Cari di Firestore
                        try {
                            const q = query(collection(db, "berita"), where("slug", "==", slugParam), limit(1));
                            const snap = await getDocs(q);
                            if (!snap.empty) {
                                idBerita = snap.docs[0].id;
                                console.log('✅ ID dari Firestore by slug:', idBerita);
                            }
                        } catch (e) {
                            console.error('❌ Error:', e);
                        }
                    }
                }
            }
            
            // METHOD 3: Parse dari pathname
            if (!idBerita) {
                let path = window.location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/, '');
                if (path.startsWith('baca/')) {
                    let slugPart = cleanSlug(path.substring(5));
                    if (slugPart) {
                        const pathId = extractId(slugPart);
                        if (pathId) {
                            idBerita = pathId;
                            console.log('✅ ID dari path:', idBerita);
                        } else {
                            try {
                                const q = query(collection(db, "berita"), where("slug", "==", slugPart), limit(1));
                                const snap = await getDocs(q);
                                if (!snap.empty) {
                                    idBerita = snap.docs[0].id;
                                    console.log('✅ ID dari Firestore by path slug:', idBerita);
                                }
                            } catch (e) {
                                console.error('❌ Error:', e);
                            }
                        }
                    }
                }
            }

            // JIKA TIDAK DITEMUKAN
            if (!idBerita) {
                loadingEl.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-exclamation-triangle text-5xl text-yellow-500 mb-4"></i>
                        <p class="text-red-500 font-bold text-lg">Artikel Tidak Ditemukan!</p>
                        <p class="text-gray-500 mt-2">URL tidak valid atau artikel sudah dihapus.</p>
                        <a href="{{ site.baseurl }}/" class="inline-block mt-4 bg-red-600 text-white px-6 py-2 rounded-full hover:bg-red-700">
                            ← Kembali ke Beranda
                        </a>
                    </div>
                `;
                return;
            }

            // AMBIL DATA
            console.log('📥 Fetching document:', idBerita);
            const docRef = doc(db, "berita", idBerita);
            const docSnap = await getDoc(docRef);

            if (!docSnap.exists()) {
                loadingEl.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-file-alt text-5xl text-gray-300 mb-4"></i>
                        <p class="text-red-500 font-bold text-lg">Berita Tidak Ditemukan!</p>
                        <p class="text-gray-500 mt-2">ID: <code>${idBerita}</code></p>
                        <a href="{{ site.baseurl }}/" class="inline-block mt-4 bg-red-600 text-white px-6 py-2 rounded-full hover:bg-red-700">
                            ← Kembali ke Beranda
                        </a>
                    </div>
                `;
                return;
            }

            const data = docSnap.data();
            console.log('✅ Berita ditemukan:', data.title);

            // Update URL browser ke format bersih
            const cleanSlugValue = data.slug || 'berita';
            const cleanUrl = buildBeritaUrl(cleanSlugValue, idBerita);
            
            if (window.location.pathname + window.location.search !== cleanUrl) {
                window.history.replaceState({}, data.title, cleanUrl);
                console.log('🔄 URL updated to:', cleanUrl);
            }

            // Update judul tab
            document.title = `${data.title || 'Berita'} - SIOMAI Magelang`;

            // Isi konten
            document.getElementById('detail-judul').textContent = data.title || 'Tanpa Judul';
            document.getElementById('detail-kategori').textContent = data.category || 'Berita';
            
            if (data.createdAt) {
                const date = data.createdAt.toDate();
                document.getElementById('detail-tanggal').innerHTML = `
                    <i class="far fa-calendar-alt"></i> 
                    Diterbitkan: ${date.toLocaleDateString('id-ID', { 
                        weekday: 'long',
                        day: '2-digit', 
                        month: 'long', 
                        year: 'numeric' 
                    })}
                `;
            }

            if (data.imageUrl) {
                document.getElementById('detail-gambar').src = data.imageUrl;
                document.getElementById('detail-gambar').alt = data.title || '';
                document.getElementById('detail-gambar-container').classList.remove('hidden');
            }

            document.getElementById('detail-isi').innerHTML = data.content || '<p class="text-gray-400">Tidak ada konten.</p>';

            // Setup share buttons dengan URL bersih
            setupShareButtons(data.title, window.location.href);

            // Tampilkan artikel
            loadingEl.classList.add('hidden');
            artikelEl.classList.remove('hidden');

            // Load artikel terkait
            loadArtikelTerkait(data.category, idBerita);

        } catch (error) {
            console.error("❌ Error:", error);
            loadingEl.innerHTML = `
                <div class="text-center">
                    <i class="fas fa-exclamation-circle text-5xl text-red-500 mb-4"></i>
                    <p class="text-red-500 font-bold">Terjadi Kesalahan!</p>
                    <p class="text-gray-500 mt-2">${error.message}</p>
                    <button onclick="location.reload()" class="inline-block mt-4 bg-red-600 text-white px-6 py-2 rounded-full hover:bg-red-700">
                        🔄 Muat Ulang
                    </button>
                </div>
            `;
        }
    }

    // === LOAD ARTIKEL TERKAIT ===
    async function loadArtikelTerkait(kategori, currentId) {
        const grid = document.getElementById('artikel-terkait');
        
        try {
            const q = query(
                collection(db, "berita"),
                where("status", "==", "publish"),
                orderBy("createdAt", "desc"),
                limit(4)
            );
            
            const snapshot = await getDocs(q);
            grid.innerHTML = '';
            
            let count = 0;
            
            for (const doc of snapshot.docs) {
                if (doc.id === currentId) continue;
                if (count >= 3) break;
                
                const data = doc.data();
                const id = doc.id;
                
                // Ringkasan
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data.content || '';
                const textContent = tempDiv.textContent || '';
                const ringkasan = textContent.split(/\s+/).slice(0, 12).join(" ") + "...";
                
                // ✅ URL FIX: Absolute dari root
                const urlSlug = data.slug || 'berita';
                const beritaUrl = buildBeritaUrl(urlSlug, id);
                
                let tanggal = '';
                if (data.createdAt) {
                    tanggal = data.createdAt.toDate().toLocaleDateString('id-ID', { 
                        day: '2-digit', month: 'long', year: 'numeric' 
                    });
                }
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition';
                card.innerHTML = `
                    <img src="${data.imageUrl || 'https://i.ibb.co.com/LzKHZzJc/Picsart-26-04-18-22-27-35-100.png'}" 
                         class="w-full h-40 object-cover" alt="${data.title || ''}" loading="lazy">
                    <div class="p-4">
                        <span class="text-xs text-red-600 font-semibold uppercase">${data.category || 'Berita'}</span>
                        <h3 class="font-bold mt-1 mb-2 line-clamp-2">
                            <a href="${beritaUrl}" class="text-gray-800 hover:text-red-600 transition">
                                ${data.title || 'Tanpa Judul'}
                            </a>
                        </h3>
                        <p class="text-gray-500 text-xs">${tanggal}</p>
                    </div>
                `;
                
                grid.appendChild(card);
                count++;
            }
            
            if (count === 0) {
                grid.innerHTML = '<p class="col-span-3 text-center text-gray-500">Belum ada artikel lainnya.</p>';
            }
            
        } catch (error) {
            console.error("Gagal load artikel terkait:", error);
            grid.innerHTML = '<p class="col-span-3 text-center text-gray-500">Gagal memuat artikel terkait.</p>';
        }
    }

    // === SETUP SHARE BUTTONS ===
    function setupShareButtons(title, url) {
        // Bersihkan URL untuk share
        const cleanUrl = url.replace(/baca\.html\?slug=baca\//, 'baca?slug=');
        const encodedUrl = encodeURIComponent(cleanUrl);
        const encodedTitle = encodeURIComponent(title);
        
        const fbBtn = document.getElementById('share-facebook');
        if (fbBtn) fbBtn.href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
        
        const twBtn = document.getElementById('share-twitter');
        if (twBtn) twBtn.href = `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`;
        
        const waBtn = document.getElementById('share-whatsapp');
        if (waBtn) waBtn.href = `https://wa.me/?text=${encodedTitle}%20${encodedUrl}`;
        
        const copyBtn = document.getElementById('copy-link');
        if (copyBtn) {
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(cleanUrl);
                    copyBtn.innerHTML = '<i class="fas fa-check mr-2"></i> Tersalin!';
                    copyBtn.classList.add('bg-green-500');
                    copyBtn.disabled = true;
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i class="fas fa-link mr-2"></i> Salin Link';
                        copyBtn.classList.remove('bg-green-500');
                        copyBtn.disabled = false;
                    }, 2000);
                } catch {
                    alert('Link: ' + cleanUrl);
                }
            });
        }
    }

    // === START ===
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ambilDetailBerita);
    } else {
        ambilDetailBerita();
    }
</script>

}
