<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIOMAI - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <style>
        .hidden { display: none !important; }
        #editor-container { height: 300px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-900">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Admin Login</h2>
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="login-email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <div class="relative mt-1">
                        <input type="password" id="login-password" class="block w-full px-3 py-2 pr-16 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm font-medium text-gray-500 hover:text-blue-600 focus:outline-none">
                            Lihat
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Masuk</button>
                <p id="login-error" class="text-red-500 text-sm mt-3 hidden"></p>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hidden flex h-screen bg-gray-100">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-4 bg-gray-800">
                <h1 class="text-xl font-bold">SIOMAI Admin</h1>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" onclick="showSection('list-berita')" class="block py-2 px-4 rounded hover:bg-gray-700">Kelola Berita</a>
                <a href="#" onclick="showSection('tambah-berita')" class="block py-2 px-4 rounded hover:bg-gray-700">Tambah Berita</a>
                <a href="#" onclick="showSection('kategori')" class="block py-2 px-4 rounded hover:bg-gray-700">Kelola Kategori</a>
            </nav>
            <div class="p-4">
                <button id="logout-btn" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded text-white font-semibold">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto">
            
            <!-- List Berita Section -->
            <section id="list-berita" class="section">
                <h2 class="text-2xl font-bold mb-4">Daftar Berita</h2>
                <div class="bg-white rounded shadow p-4">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Judul</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Slug</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="berita-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Tambah / Edit Berita Section -->
            <section id="tambah-berita" class="section hidden">
                <h2 id="form-title" class="text-2xl font-bold mb-4">Tambah / Edit Berita</h2>
                <div class="bg-white rounded shadow p-6">
                    <form id="editor-form">
                        <input type="hidden" id="post-id">
                        
                        <!-- Judul Berita -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Judul Berita</label>
                            <input type="text" id="post-title" class="w-full px-3 py-2 border rounded-md" required oninput="generateSlug()">
                        </div>

                        <!-- FIELD SLUG -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                Slug URL 
                                <span class="text-xs text-gray-500">(otomatis dari judul)</span>
                            </label>
                            <div class="flex gap-2">
                                <input 
                                    type="text" 
                                    id="post-slug" 
                                    class="w-full px-3 py-2 border rounded-md bg-gray-50" 
                                    placeholder="slug-akan-terisi-otomatis"
                                    readonly
                                >
                                <button 
                                    type="button" 
                                    id="edit-slug-btn"
                                    class="px-3 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-sm whitespace-nowrap"
                                    onclick="toggleSlugEdit()"
                                >
                                    ✏️ Edit
                                </button>
                            </div>
                            <small class="text-gray-500">Contoh: program-prodamai-magelang-2025</small>
                        </div>

                        <!-- Kategori & Status (Grid 2 Kolom) -->
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                                <select id="post-category" class="w-full px-3 py-2 border rounded-md">
                                    <option value="berita">Berita</option>
                                    <option value="pengumuman">Pengumuman</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                                <select id="post-status" class="w-full px-3 py-2 border rounded-md">
                                    <option value="draft">Draft</option>
                                    <option value="publish">Publish</option>
                                </select>
                            </div>
                        </div>

                        <!-- Upload Gambar Cover -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Upload Gambar Cover</label>
                            <input type="file" id="post-image" class="w-full" accept="image/*">
                            <div id="image-preview-container" class="mt-2 hidden">
                                <img id="image-preview" src="" class="h-32 object-cover rounded border">
                                <input type="hidden" id="post-image-url">
                            </div>
                            <p id="upload-status" class="text-sm text-blue-500 mt-1"></p>
                        </div>

                        <!-- Editor Konten -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Konten Berita</label>
                            <div id="editor-container"></div>
                        </div>

                        <!-- Tombol Aksi -->
                        <div class="flex space-x-2">
                            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Simpan Berita</button>
                            <button type="button" id="btn-preview" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Preview</button>
                            <button type="button" onclick="showSection('list-berita')" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Batal</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Preview Modal -->
            <div id="preview-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div class="bg-white rounded-lg shadow-lg w-3/4 max-h-[90vh] overflow-y-auto p-6">
                    <div class="flex justify-between items-center border-b pb-2 mb-4">
                        <h2 class="text-xl font-bold">Preview Mode</h2>
                        <button id="close-preview" class="text-gray-500 hover:text-black">&times; Tutup</button>
                    </div>
                    <div id="preview-content" class="prose max-w-none"></div>
                </div>
            </div>

            <!-- Kelola Kategori Section -->
            <section id="kategori" class="section hidden">
                <h2 class="text-2xl font-bold mb-4">Kelola Kategori</h2>
                <div class="bg-white rounded shadow p-6">
                    <p>Fitur CRUD Kategori (Contoh Pengembangan)</p>
                </div>
            </section>

        </main>
    </div>

    <script type="module" src="/admin/js/app.js"></script>
    <script>
        // Simple UI Router
        function showSection(id) {
            document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        
        // Slug Generator Functions
        function generateSlugFromTitle(title) {
            return title
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '')
                .substring(0, 100);
        }

        window.generateSlug = function() {
            const titleInput = document.getElementById('post-title');
            const slugInput = document.getElementById('post-slug');
            
            if (slugInput && !slugInput.dataset.manualEdit) {
                slugInput.value = generateSlugFromTitle(titleInput.value);
            }
        };

        window.toggleSlugEdit = function() {
            const slugInput = document.getElementById('post-slug');
            const editBtn = document.getElementById('edit-slug-btn');
            
            if (slugInput.readOnly) {
                // Mode edit manual
                slugInput.readOnly = false;
                slugInput.classList.remove('bg-gray-50');
                slugInput.classList.add('bg-white', 'border-2', 'border-yellow-500');
                slugInput.dataset.manualEdit = 'true';
                editBtn.innerHTML = '🔄 Reset';
                editBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                editBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
            } else {
                // Kembali ke auto-generate
                slugInput.readOnly = true;
                slugInput.classList.add('bg-gray-50');
                slugInput.classList.remove('bg-white', 'border-2', 'border-yellow-500');
                delete slugInput.dataset.manualEdit;
                editBtn.innerHTML = '✏️ Edit';
                editBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                editBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                
                // Generate ulang dari judul
                const titleInput = document.getElementById('post-title');
                slugInput.value = generateSlugFromTitle(titleInput.value);
            }
        };
    </script>
</body>
</html>
