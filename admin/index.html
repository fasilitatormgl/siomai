<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIOMAI Admin</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8}
header{background:#1f4b99;color:#fff;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:20px}
.card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer}
</style></head>
<body>
<header><h2>Dashboard CMS SIOMAI</h2></header>
<div class="grid">
<div class="card">📰 Tambah Berita</div>
<div class="card">✏️ Edit Berita</div>
<div class="card">🖼 Upload Gambar</div>
<div class="card">📄 Draft / Publish</div>
<div class="card">🏷 Kelola Kategori</div>
<div class="card">👁 Preview</div>
<div class="card">🚪 Logout</div>
</div>
</body></html>
